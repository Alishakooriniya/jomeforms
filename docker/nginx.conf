# Jomeforms web container: static SPA + same-origin proxy to the API.
# Cookies and Authorization headers pass through untouched, so the frontend can
# call /api/v1/* without any CORS configuration.

upstream jomeforms_api {
  server api:4000;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://jomeforms_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    # Matches MAX_UPLOAD_MB plus multipart overhead.
    client_max_body_size 12m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Hashed filenames: safe to cache for a year. `expires` is used instead of
  # add_header so the security headers above stay inherited.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # Client-side routing: unknown paths render the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cache the app shell; hashed assets are cached below instead.
  location = /index.html {
    expires -1;
  }
}
