# Jomeforms full stack: PostgreSQL + migrations + API + web (nginx).
#
#   cp docker/.env.example docker/.env
#   # edit JWT_SECRET and POSTGRES_PASSWORD
#   docker compose --env-file docker/.env up -d --build
#
# Optional one-shot seed (creates the first superadmin):
#   docker compose --env-file docker/.env --profile seed run --rm seed

name: jomeforms

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: "4000"
  API_PREFIX: /api/v1
  DATABASE_URL: postgres://${POSTGRES_USER:-jomeforms}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-jomeforms}
  DATABASE_SSL: "false"
  DATABASE_POOL_MAX: "10"
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
  JWT_ISSUER: ${JWT_ISSUER:-jomeforms-api}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-jomeforms-web}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  # The browser calls the API through nginx, so this must be the public web URL.
  CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
  TRUST_PROXY: "1"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  UPLOAD_DIR: /app/var/uploads
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
  RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
  LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jomeforms}
      POSTGRES_USER: ${POSTGRES_USER:-jomeforms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]

  migrate:
    build:
      context: ./backend
    image: jomeforms-api:local
    command: ["node", "dist/db/cli.js", "migrate"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  api:
    build:
      context: ./backend
    image: jomeforms-api:local
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/var/uploads
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [backend]

  web:
    build:
      context: .
      args:
        VITE_API_MODE: server
        VITE_API_BASE_URL: /api/v1
    image: jomeforms-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [backend]

  # Opt-in: `--profile seed run --rm seed`
  seed:
    build:
      context: ./backend
    image: jomeforms-api:local
    profiles: [seed]
    command: ["node", "dist/db/cli.js", "seed"]
    environment:
      <<: *api-environment
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-superadmin}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-مدیر ارشد سامانه}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks: [backend]

volumes:
  db_data:
  uploads:

networks:
  backend:
    driver: bridge
